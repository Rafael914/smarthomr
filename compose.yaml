services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: "/"
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"
